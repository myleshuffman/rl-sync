<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Signed Out – RL Sync</title>
    <link rel="icon" type="image/svg+xml" href="/static/escalation_icon.svg">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --dc-navy: #0c2a4f;
            --dc-blue: #0570d6;
            --dc-blue-hover: #045eb8;
            --dc-bg: #f4f6fa;
            --dc-text: #1a2332;
            --dc-muted: #64748b;
            --dc-card-border: #e2e8f0;
        }
        body {
            background: var(--dc-bg);
            color: var(--dc-text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
        .auth-card {
            max-width: 420px;
            background: #fff;
            border: 1px solid var(--dc-card-border);
            border-radius: 6px;
            box-shadow: 0 4px 16px rgba(12, 42, 79, 0.06);
        }
        .auth-card .brand {
            background: var(--dc-navy);
            color: #fff;
            padding: 22px 24px;
            border-top-left-radius: 6px;
            border-top-right-radius: 6px;
            text-align: center;
        }
        .auth-card .brand .logo {
            font-size: 22px;
            font-weight: 600;
            letter-spacing: -0.3px;
        }
        .auth-card .brand .logo .dot {
            color: var(--dc-blue);
            font-size: 14px;
            vertical-align: super;
        }
        .auth-card .brand .sublabel {
            font-size: 12px;
            color: #a8b8cf;
            margin-top: 4px;
        }
        .auth-card .body {
            padding: 32px 28px;
            text-align: center;
        }
        .btn-dc-primary {
            background: var(--dc-blue);
            color: #fff;
            border: 1px solid var(--dc-blue);
        }
        .btn-dc-primary:hover {
            background: var(--dc-blue-hover);
            border-color: var(--dc-blue-hover);
            color: #fff;
        }
    </style>
</head>

<body>
    <div class="container d-flex align-items-center justify-content-center" style="min-height: 100vh;">
        <div class="auth-card w-100">
            <div class="brand">
                <div class="logo">digicert<span class="dot">°</span>ONE</div>
                <div class="sublabel">Professional Services</div>
            </div>
            <div class="body">
                <h5 class="mb-2">You've been signed out</h5>
                <p class="text-muted mb-4" style="font-size: 13px;">Click below to sign back in.</p>
                <a href="/login" class="btn btn-dc-primary w-100">Sign in</a>
            </div>
        </div>
    </div>
</body>

</html>
